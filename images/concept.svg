<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="40" y="38" font-size="20" font-weight="600" fill="#1c2330">Smart charge switch: how it looks and where it sits</text>
  <text x="40" y="60" fill="#5b6575">Concept drawing. Sizes are estimates until the parts are measured.</text>

  <!-- wall and charger -->
  <rect x="40" y="110" width="26" height="250" fill="#e2e5ea"/>
  <rect x="66" y="190" width="70" height="90" rx="10" fill="#f4f5f7" stroke="#1c2330" stroke-width="1.5"/>
  <rect x="136" y="226" width="8" height="18" rx="3" fill="#1c2330"/>
  <text x="101" y="305" text-anchor="middle" fill="#1c2330">USB-C</text>
  <text x="101" y="322" text-anchor="middle" fill="#1c2330">charger</text>

  <!-- charger cable -->
  <path d="M144 235 C 220 235, 230 300, 300 300 S 360 262, 392 262" stroke="#1c2330" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="390" y="252" width="22" height="20" rx="4" fill="#5b6575"/>
  <text x="262" y="340" text-anchor="middle" fill="#5b6575">your normal</text>
  <text x="262" y="357" text-anchor="middle" fill="#5b6575">charging cable</text>

  <!-- the adapter, drawn as a box seen from above and slightly to the side -->
  <polygon points="412,225 600,225 624,205 436,205" fill="#dfe6f5" stroke="#1c2330" stroke-width="1.5"/>
  <polygon points="600,225 624,205 624,279 600,299" fill="#c5d0e8" stroke="#1c2330" stroke-width="1.5"/>
  <rect x="412" y="225" width="188" height="74" rx="6" fill="#eef2fb" stroke="#1c2330" stroke-width="1.5"/>
  <rect x="412" y="250" width="10" height="24" rx="3" fill="#1c2330"/>
  <circle cx="470" cy="262" r="7" fill="#d92d20"/>
  <circle cx="470" cy="262" r="12" fill="none" stroke="#d92d20" stroke-width="1" opacity=".5"/>
  <circle cx="545" cy="262" r="9" fill="#ffffff" stroke="#1c2330" stroke-width="1.5"/>
  <text x="506" y="190" text-anchor="middle" font-weight="600" fill="#1c2330">Smart charge switch</text>

  <!-- tail cable to phone -->
  <path d="M612 262 C 670 262, 680 300, 740 300 S 780 262, 806 262" stroke="#1c2330" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="804" y="253" width="22" height="18" rx="4" fill="#5b6575"/>

  <!-- phone -->
  <rect x="826" y="150" width="130" height="230" rx="18" fill="#f4f5f7" stroke="#1c2330" stroke-width="1.5"/>
  <rect x="838" y="166" width="106" height="198" rx="8" fill="#ffffff" stroke="#c9ced6"/>
  <rect x="856" y="240" width="62" height="30" rx="5" fill="none" stroke="#1c2330" stroke-width="1.5"/>
  <rect x="918" y="249" width="5" height="12" rx="2" fill="#1c2330"/>
  <rect x="859" y="243" width="45" height="24" rx="3" fill="#1f9d55"/>
  <text x="891" y="296" text-anchor="middle" font-weight="600" fill="#1c2330">80 %</text>
  <text x="891" y="405" text-anchor="middle" fill="#1c2330">phone</text>

  <!-- wifi link -->
  <path d="M860 140 C 800 80, 580 80, 520 175" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="6 5"/>
  <polygon points="520,175 517,161 529,167" fill="#2563eb"/>
  <text x="690" y="88" text-anchor="middle" fill="#2563eb">"I am at 80 %" over Wi-Fi</text>

  <!-- callouts -->
  <g stroke="#5b6575" stroke-width="1" fill="none">
    <path d="M417 280 L390 400"/><path d="M470 276 L470 400"/><path d="M545 273 L570 400"/><path d="M700 292 L700 400"/>
  </g>
  <g fill="#1c2330" text-anchor="middle">
    <text x="380" y="420" font-weight="600">USB-C socket</text>
    <text x="380" y="438" fill="#5b6575">the charger cable</text>
    <text x="380" y="455" fill="#5b6575">plugs in here</text>
    <text x="478" y="420" font-weight="600">Light</text>
    <text x="478" y="438" fill="#5b6575">on: charging</text>
    <text x="478" y="455" fill="#5b6575">slow blink: paused</text>
    <text x="478" y="472" fill="#5b6575">off: no phone</text>
    <text x="582" y="420" font-weight="600">Button</text>
    <text x="582" y="438" fill="#5b6575">charge to 100 %</text>
    <text x="582" y="455" fill="#5b6575">this once</text>
    <text x="712" y="420" font-weight="600">Fixed cable</text>
    <text x="712" y="438" fill="#5b6575">goes to the phone</text>
  </g>

  <text x="506" y="498" text-anchor="middle" fill="#5b6575" font-size="12">Case: about 52 mm long, 28 mm wide, 12.5 mm thick</text>

  <rect x="40" y="510" width="920" height="80" rx="10" fill="#f4f5f7"/>
  <text x="60" y="538" fill="#1c2330" font-weight="600">What it does</text>
  <text x="60" y="560" fill="#1c2330">The phone reports its battery level. At the upper limit the switch cuts the 5 V, exactly as if you pulled the plug.</text>
  <text x="60" y="578" fill="#1c2330">When the battery falls to the lower limit, it switches the 5 V back on. Limits are set from a web page.</text>
</svg>
